name: Deploy MTA App
on:
  workflow_call:
    inputs:
      environment:
        description: "Target Environment"
        required: false
        type: string
        default: "development"
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Target Environment"
        required: true
        type: choice
        default: "development"
        options:
          - development
          - quality
          - production

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  APP_NAME: erp-portal

jobs:
  setup:
    outputs:
      app-id: ${{ steps.extract_app_id.outputs.APP_ID }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/Checkout@v7
      - name: Extract App Id
        id: extract_app_id
        run: |
          # Read the root 'ID' property from mta.yaml using yq
          EXTRACTED_ID=$(yq '.ID' mta.yaml)
          echo "Found App ID: $EXTRACTED_ID"
          echo "APP_ID=$EXTRACTED_ID" >> $GITHUB_OUTPUT
  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Application
        uses: ./.github/actions/build
        with:
          upload-mtar: true
          node-ver: ${{ vars.NODE_VER }}

  deploy:
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    outputs:
      op-id: ${{ steps.deploy_btp.outputs.op_id }}
      status: ${{ steps.deploy_btp.outputs.status }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VER }}
          cache: npm

      - name: Installs Dependencies
        run: npm ci

      - name: Setup CF CLI
        uses: ./.github/actions/cloudfoundry/setup
        with:
          cf-api: ${{ vars.CF_API }}
          cf-org: ${{ vars.CF_ORG }}
          cf-space: ${{ vars.CF_SPACE }}
          cf-origin-id: ${{ vars.CF_ORIGIN }}
          cf-user: ${{ secrets.CF_USER }}
          cf-pwd: ${{ secrets.CF_PASS }}
          node-ver: ${{ vars.NODE_VER }}

      - name: Install Depedencies
        run: npm ci

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          path: ./mta_archives/

      - name: Deploy to BTP
        id: deploy_btp # Added an ID to reference the outputs later
        run: |
          set -euo pipefail

          echo "Starting deployment..."

          # Temporarily disable exit-on-error
          set +e 
          echo y | cf deploy mta_archives/archive.mtar --retries 1 | tee deploy_output.log
          DEPLOY_EXIT_CODE=$?
          set -e

          # Extract the Operation ID
          OP_ID=$(grep -oP 'Operation ID:\s*\K[a-z0-9-]+' deploy_output.log || true)

          # 1. Write outputs to GITHUB_OUTPUT
          echo "op_id=$OP_ID" >> $GITHUB_OUTPUT
          echo "exit_code=$DEPLOY_EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            # Write failure status
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "::error::Deployment failed with exit code $DEPLOY_EXIT_CODE"
            
            if [ -n "$OP_ID" ]; then
              echo "Captured Operation ID: $OP_ID"
              
              echo "--- Downloading Deployment Logs ---"
              cf dmol -i "$OP_ID" || true
              
              echo "--- Printing Logs ---"
              cat *.log 2>/dev/null || echo "No local log files generated by dmol."
              
              echo "--- Aborting Process & Canceling Pending Deployments ---"
              cf deploy -i "$OP_ID" -a abort || true
            else
              echo "Warning: Could not extract Operation ID from deployment logs."
            fi
            
            # Explicitly fail the step
            exit $DEPLOY_EXIT_CODE
          fi

          # Write success status
          echo "status=success" >> $GITHUB_OUTPUT
          echo "Deployment successful! Operation ID: $OP_ID"
          
      - name: Post Failed Deployment status
        if: ${{ always() && steps.deploy_btp.outputs.status == 'failed' }}
        uses: ./.github/actions/cloudfoundry/log-parser/action.yml
        with:
          op-id: ${{ steps.deploy_btp.outputs.op-id }}
      - name: Check Deployment Status
        if: ${{ always() &&  steps.deploy_btp.outputs.status == 'success' }}
        run: |
          cf logs "${{ needs.setup.outputs.app-id }}-srv" --recent
          cf logs "${{ needs.setup.outputs.app-id }}-db-deployer" --recent
          echo "The deployment finished with status: ${{ steps.deploy_btp.outputs.status }}"
          echo "The Operation ID was: ${{ steps.deploy_btp.outputs.op_id }}"
          echo "The Exit Code was: ${{ steps.deploy_btp.outputs.exit_code }}"
