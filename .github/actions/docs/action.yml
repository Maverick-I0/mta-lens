name: "Generate and PR Docs"
description: "Generates documentation and opens a PR using the official GitHub CLI"

inputs:
  github_token:
    description: "GitHub token for CLI authentication"
    required: true
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      shell: bash
      run: npm ci

    - name: Generate Documentation
      shell: bash
      run: npm run docs:ci

    - name: Commit and Create PR via GitHub CLI
      shell: bash
      # The GitHub CLI automatically looks for the GH_TOKEN environment variable
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # 1. Check if there are any modified or untracked files
        git add .
        if git diff-index --quiet HEAD; then
          echo "No documentation changes detected. Skipping PR."
          exit 0
        fi

        echo "Documentation changes detected. Preparing branch..."

        # 2. Setup standard GitHub Actions bot identity
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # 3. Create and checkout the bot branch
        BRANCH_NAME="bot/update-docs"
        git checkout -b "$BRANCH_NAME"

        # 4. Commit and force-push (force-push ensures we overwrite an existing unmerged PR branch)
        git commit -m "docs: auto-update documentation [skip ci]"
        git push origin "$BRANCH_NAME" --force

        # 5. Check if a PR already exists for this branch
        PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq 'length')
        
        if [ "$PR_EXISTS" -eq "0" ]; then
          echo "Creating new Pull Request..."
          gh pr create \
            --title "docs: update auto-generated documentation" \
            --body "Automated documentation update generated by the CI pipeline.
            
        **Note:** This PR uses the \`docs:\` prefix, so merging it will **not** trigger a new version bump in Release Please." \
            --base main \
            --head "$BRANCH_NAME" \
            --label "documentation"
        else
          echo "A Pull Request for this branch already exists. The branch has been updated with the latest changes."
        fi