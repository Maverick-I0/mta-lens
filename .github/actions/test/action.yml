name: "Code Quality & Tests"
description: "Runs linting, unit tests with coverage, and integration tests"

inputs:
  run_integration:
    description: "Set to 'true' to run integration tests (default: true)"
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      shell: bash
      run: npm ci

    - name: Run Linter
      shell: bash
      run: npm run lint

    - name: Run Unit Tests & Print Coverage
      shell: bash
      # The --coverage flag forces most test runners (Jest/Vitest) to capture 
      # coverage and automatically print the table output to the GitHub Actions console.
      run: npm run test:unit -- --coverage

    - name: Run Integration Tests
      if: ${{ inputs.run_integration == 'true' }}
      shell: bash
      run: npm run test:integration