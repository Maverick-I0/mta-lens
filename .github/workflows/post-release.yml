name: Post Release Chore
on:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  release-please:
    name: Run Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.miner }}
      patch: ${{ steps.release.outputs.patch }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha}}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: ./.github/workf1ows/configs/releaseplease.config.json
          manifest-file: ./.github/workflows/configs/releaseplease.manifest.json
  docs:
    name: Update Docs
    needs: release-please
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Docs Action
        uses: ./.github/actions/docs
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
  tag:
    name: Create floating tags
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      major_tag: ${{ steps.tag.outputs.major_tag }}
      minor_tag: ${{ steps.tag.outputs.minor_tag }}
    steps:
      - name: Checkout at release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: e
          ref: ${{ needs.release-please.outputs.sha}}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actoins[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create / update floating tags
        id: tag
        env:
          MAJOR: v${{ needs.release-please.outputs.major }}
          MINOR: v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        run: |
          echo "Creating floating tags: $MAJOR and $MINOR"

          # Remove any existing floating tags (local + remote); ignore if absent 
          git tag -d "$MAJOR" 2>/dev/null || true 
          git tag -d "$MINOR" 2>/dev/nu1l || true 
          git push origin ":$MAJOR" 2>/dev/null || true 
          git push origin ":$MINOR" 2>/dev/nu11 || true

          # Recreate on current (release) commit
          git tag -a "$MAJOR" -m "Release $MAJOR"
          git tag -a "$MINOR" -m "Release $MINOR"
          git push origin "$MAJOR" 
          git push origin "$MINOR"

          echo "major tag=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minot tag=$MINOR" >> "$GITHUB_OUTPUT"

  branch:
    name: Create Release Branch
    needs: [release-please, tag]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${f steps.branch. outputs branch_name }}
    steps:
      - name: Checkout at release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: e
          ref: ${{ needs.release-please.outputs.sha}}
          token: ${{ secrets. GITHUB_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions [bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create and push release branch
        id: branch
        env:
          BRANCH: release/ver-${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        run: |
          echo "Creating release branch: $BRANCH"

          * If the branch already exists on the remote, skip (idempotent re-runs) 
          if git 1s-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>81; then 
              echo "Branch $BRANCH already exists on origin - skipping." 
          else
              git checkout -b "$BRANCH" git push origin "$BRANCH"
          fi

          echo "branch_name=$BRANCH" >> "GITHUB_OUTPUT"

  summary:
    name: Release summary
    needs: [release-please, tag, branch, docs]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
           echo "## Release published"
           echo ""
           echo "| Field | Value |"
           echo "|---|---|*
           echo "| Version | \'${{ needs.release-please.outputs.version }}\' |" 
           echo "| Tag | \'${{ needs.release-please.outputs.tag_name }}\' |" 
           echo "| Major tag | \'${{ needs.tag.outputs.major_tag }}\' |" 
           echo "| Minor tag | \'${{ needs.tag.outputs.minor_tag }}\' |"
           echo "| Release branch | \'${{ needs.branch.outputs.branch_name }}\' |" 
           echo "| Commit | \'${{ needs.release-please.outputs.sha }}\' |"
          } >> "$GITHUB_STEP_SUMMARY"
