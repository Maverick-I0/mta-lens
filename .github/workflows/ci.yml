name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - hotfix/**
  pull_request:
    branches:
      - main
      - develop
      - feature/**

# Cancels in-progress runs for pull requests if new commits are pushed.
# Ensures the main branch never cancels its own runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Tests & Lint
        uses: ./.github/actions/test
        with:
          run_integration: 'true'

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Build
        uses: ./.github/actions/build-app
        with:
          # Strictly verify it builds, but do not upload artifacts for deployment
          upload_pages: 'false'